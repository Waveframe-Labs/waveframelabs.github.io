<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc">
  <title id="title">Waveframe canonical execution-governance architecture</title>
  <desc id="desc">Source policy is reviewed and published through Waveframe Ledger and the Contract Compiler. At runtime an agent or application calls a Guard-mediated tool. Guard resolves the exact published authority, builds the canonical proposal through Proposal Normalizer, invokes CRI-CORE for admissibility, and only invokes the wrapped mutation when allowed. Cloud distributes authority and preserves evidence but does not replace CRI-CORE's decision or Guard's local mutation attestation.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#15171d"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="box" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#171a21"/><stop offset="1" stop-color="#101218"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto"><path d="M2 1 L10 6 L2 11 Z" fill="#ff5a0a"/></marker>
  </defs>
  <rect width="1200" height="1420" rx="28" fill="url(#page)"/><rect x="34" y="34" width="1132" height="1352" rx="22" fill="none" stroke="#252832" stroke-width="2"/>
  <text x="76" y="100" fill="#ff5a0a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="3">WAVEFRAME CANONICAL ARCHITECTURE · 2026-09</text>
  <text x="76" y="150" fill="#e7eaef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">Published authority → mediated execution</text>
  <text x="76" y="188" fill="#9aa3b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Policy interpretation happens before runtime. Guard receives the real call before CRI-CORE decides whether its callback may execute.</text>

  <text x="80" y="250" fill="#ff5a0a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="2">AUTHORITY FLOW</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(80 280)"><rect width="650" height="86" rx="10" fill="url(#box)" stroke="#333743"/><text x="26" y="34" fill="#e7eaef" font-size="22" font-weight="800">1 · Source policy + organizational intent</text><text x="26" y="62" fill="#9aa3b2" font-size="16">Human-owned policy, roles, thresholds, constraints, source provenance</text></g>
    <g transform="translate(80 400)"><rect width="650" height="104" rx="10" fill="url(#box)" stroke="#333743"/><text x="26" y="34" fill="#e7eaef" font-size="22" font-weight="800">2 · Waveframe Ledger 0.8.0</text><text x="26" y="62" fill="#9aa3b2" font-size="16">Diagnostics + bounded translation proposals + human confirmation</text><text x="26" y="84" fill="#9aa3b2" font-size="16">Residual unsupported meaning remains visible; model output is not authority</text></g>
    <g transform="translate(80 538)"><rect width="650" height="86" rx="10" fill="url(#box)" stroke="#333743"/><text x="26" y="34" fill="#e7eaef" font-size="22" font-weight="800">3 · Contract Compiler 0.4.0</text><text x="26" y="62" fill="#9aa3b2" font-size="16">Deterministic compiled runtime authority + contract hash + target requirements</text></g>
    <g transform="translate(80 658)"><rect width="650" height="104" rx="10" fill="#111816" stroke="#2d6f4c"/><text x="26" y="34" fill="#e7eaef" font-size="22" font-weight="800">4 · Published authority</text><text x="26" y="62" fill="#9aa3b2" font-size="16">Authority bundle + commitment + receipt + lineage + registry identity</text><text x="26" y="84" fill="#9aa3b2" font-size="16">Runtime payload remains the compiled authority contract</text></g>
  </g>
  <path d="M405 366 V390" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/><path d="M405 504 V528" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/><path d="M405 624 V648" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="790" y="300" width="330" height="450" rx="16" fill="#101218" stroke="#3a2b22" stroke-width="2"/><text x="820" y="350" fill="#ff5a0a" font-size="20" font-weight="900" letter-spacing="2">WAVEFRAME CLOUD</text><text x="820" y="388" fill="#e7eaef" font-size="23" font-weight="800">Authority + evidence plane</text><line x1="820" y1="412" x2="1090" y2="412" stroke="#252832" stroke-width="2"/><text x="820" y="458" fill="#e7eaef" font-size="18" font-weight="800">Tenant publication serving</text><text x="820" y="491" fill="#e7eaef" font-size="18" font-weight="800">Registry / runtime identity</text><text x="820" y="524" fill="#e7eaef" font-size="18" font-weight="800">Evidence preservation</text><text x="820" y="557" fill="#e7eaef" font-size="18" font-weight="800">Packages / receipts / proofs</text><text x="820" y="615" fill="#9aa3b2" font-size="16">Cloud does not author authority,</text><text x="820" y="640" fill="#9aa3b2" font-size="16">decide admissibility, or replace</text><text x="820" y="665" fill="#9aa3b2" font-size="16">Guard's local mutation attestation.</text><text x="820" y="710" fill="#ff5a0a" font-size="15" font-weight="800">Latest published release: v0.5.7</text></g>
  <path d="M730 710 C765 710 765 520 790 520" fill="none" stroke="#ff5a0a" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <text x="80" y="835" fill="#ff5a0a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="2">RUNTIME FLOW</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(80 865)"><rect width="1040" height="82" rx="10" fill="url(#box)" stroke="#333743"/><text x="26" y="32" fill="#e7eaef" font-size="22" font-weight="800">1 · Agent / application calls the Guard-wrapped tool</text><text x="26" y="59" fill="#9aa3b2" font-size="16">The original callable is not protected if another path invokes it directly.</text></g>
    <g transform="translate(80 980)"><rect width="1040" height="92" rx="10" fill="url(#box)" stroke="#ff5a0a" stroke-width="2"/><text x="26" y="32" fill="#e7eaef" font-size="22" font-weight="800">2 · Waveframe Guard 0.18.0 mediates the real call</text><text x="26" y="59" fill="#9aa3b2" font-size="16">Resolve + verify exact authority; bind actor, target, runtime facts, and mediation context.</text><text x="26" y="79" fill="#9aa3b2" font-size="16">Repository mutation uses repository_tool + an expiring bound RepositoryTarget.</text></g>
    <g transform="translate(80 1105)"><rect width="500" height="86" rx="10" fill="url(#box)" stroke="#333743"/><text x="24" y="33" fill="#e7eaef" font-size="21" font-weight="800">3 · Proposal Normalizer 0.2.0</text><text x="24" y="61" fill="#9aa3b2" font-size="16">Canonical proposal; no invented contract truth</text></g>
    <g transform="translate(620 1105)"><rect width="500" height="86" rx="10" fill="url(#box)" stroke="#333743"/><text x="24" y="33" fill="#e7eaef" font-size="21" font-weight="800">4 · CRI-CORE</text><text x="24" y="61" fill="#9aa3b2" font-size="16">Deterministic admissibility decision</text></g>
    <g transform="translate(80 1230)"><rect width="500" height="92" rx="10" fill="#111816" stroke="#2d6f4c"/><text x="24" y="32" fill="#3ddc97" font-size="20" font-weight="900">ALLOW</text><text x="24" y="59" fill="#e7eaef" font-size="20" font-weight="800">Guard invokes exact callback</text><text x="24" y="80" fill="#9aa3b2" font-size="15">Then records execution / mutation outcome</text></g>
    <g transform="translate(620 1230)"><rect width="500" height="92" rx="10" fill="#1a1010" stroke="#713232"/><text x="24" y="32" fill="#ff4d4d" font-size="20" font-weight="900">BLOCK</text><text x="24" y="59" fill="#e7eaef" font-size="20" font-weight="800">Callback never runs</text><text x="24" y="80" fill="#9aa3b2" font-size="15">Decision evidence remains inspectable</text></g>
  </g>
  <path d="M600 947 V970" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 1072 V1092" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 1148 H608" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/><path d="M870 1191 V1218" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/><path d="M870 1191 C870 1210 330 1205 330 1218" fill="none" stroke="#ff5a0a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="80" y="1370" fill="#9aa3b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Evidence flow: Guard decision + execution/mutation attestation → optional Cloud preservation → package / receipt / proof. Replay reproduces logical decisions, not physical mutation.</text>
</svg>
